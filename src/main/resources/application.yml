server:
  port: 8080

spring:
  application:
    name: order-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        order.request.latency.seconds: true
      percentiles:
        order.request.latency.seconds: 0.5, 0.95, 0.99
      minimum-expected-value:
        order.request.latency.seconds: 10ms
      maximum-expected-value:
        order.request.latency.seconds: 2s

logging:
  level:
    root: INFO
    com.example.orderapi: INFO
